<!-- ================= PRODUCTS PAGE ================= -->
<div id="productsPage" class="p-6 hidden">

  <!-- Title -->
  <h1 class="text-3xl font-bold mb-6 text-center">Our Products 🛒</h1>

  <!-- Search Bar -->
  <div class="mb-6 text-center">
    <input type="text" placeholder="Search product..."
      onkeyup="searchProduct(this.value)"
      class="w-full md:w-1/2 p-3 border rounded shadow">
  </div>

  <!-- Category Filter -->
  <div class="flex flex-wrap justify-center gap-3 mb-8">
    <button onclick="filterCategory('all')" class="bg-gray-200 px-4 py-2 rounded">All</button>
    <button onclick="filterCategory('fashion')" class="bg-gray-200 px-4 py-2 rounded">Fashion</button>
    <button onclick="filterCategory('electronics')" class="bg-gray-200 px-4 py-2 rounded">Electronics</button>
    <button onclick="filterCategory('cosmetics')" class="bg-gray-200 px-4 py-2 rounded">Cosmetics</button>
  </div>

  <!-- Products Grid -->
  <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">

    <!-- Product 1 -->
    <div class="bg-white p-4 rounded shadow" data-name="tshirt" data-category="fashion">
      <img src="https://via.placeholder.com/200" class="mx-auto mb-3">
      <h2 class="font-bold text-lg">T-Shirt</h2>
      <p class="text-gray-500">₹499</p>
      <button onclick="addToCart('T-Shirt',499)"
        class="bg-blue-500 text-white px-4 py-2 mt-3 rounded w-full">Add to Cart</button>
    </div>

    <!-- Product 2 -->
    <div class="bg-white p-4 rounded shadow" data-name="watch" data-category="electronics">
      <img src="https://via.placeholder.com/200" class="mx-auto mb-3">
      <h2 class="font-bold text-lg">Watch</h2>
      <p class="text-gray-500">₹999</p>
      <button onclick="addToCart('Watch',999)"
        class="bg-blue-500 text-white px-4 py-2 mt-3 rounded w-full">Add to Cart</button>
    </div>

    <!-- Product 3 -->
    <div class="bg-white p-4 rounded shadow" data-name="lipstick" data-category="cosmetics">
      <img src="https://via.placeholder.com/200" class="mx-auto mb-3">
      <h2 class="font-bold text-lg">Lipstick</h2>
      <p class="text-gray-500">₹299</p>
      <button onclick="addToCart('Lipstick',299)"
        class="bg-blue-500 text-white px-4 py-2 mt-3 rounded w-full">Add to Cart</button>
    </div>

    <!-- Product 4 -->
    <div class="bg-white p-4 rounded shadow" data-name="shoes" data-category="fashion">
      <img src="https://via.placeholder.com/200" class="mx-auto mb-3">
      <h2 class="font-bold text-lg">Shoes</h2>
      <p class="text-gray-500">₹1499</p>
      <button onclick="addToCart('Shoes',1499)"
        class="bg-blue-500 text-white px-4 py-2 mt-3 rounded w-full">Add to Cart</button>
    </div>

  </div>

</div>

<script>
let cart = [];

// Show Pages
function showPage(page){
  document.getElementById("homePage").classList.add("hidden");
  document.getElementById("productsPage").classList.add("hidden");

  document.getElementById(page + "Page").classList.remove("hidden");
}

// Add to Cart
function addToCart(name, price){
  let item = cart.find(p => p.name === name);
  if(item){
    item.qty++;
  } else {
    cart.push({name, price, qty:1});
  }
  updateCount();
}

// Update Cart Count
function updateCount(){
  let count = cart.reduce((sum, item) => sum + item.qty, 0);
  document.getElementById("count").innerText = count;
  document.getElementById("countMobile").innerText = count;
}

// Search Function
function searchProduct(value){
  let items = document.querySelectorAll("#productList > div");
  value = value.toLowerCase();

  items.forEach(item=>{
    let name = item.dataset.name;
    item.style.display = name.includes(value) ? "block" : "none";
  });
}

// Filter Category
function filterCategory(cat){
  let items = document.querySelectorAll("#productList > div");

  items.forEach(item=>{
    let category = item.dataset.category;
    item.style.display = (cat === "all" || category === cat) ? "block" : "none";
  });
}
</script>
