<!DOCTYPE html>
<html>
<head>
  <title>ShopEasy</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- ================= NAVBAR ================= -->
<nav class="bg-blue-500 text-white p-4 flex justify-between">
  <h1 class="text-xl font-bold">ShopEasy</h1>

  <div class="space-x-4">
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('products')">Products</button>
    <button onclick="showPage('cart')">
      Cart 🛒 <span id="count">0</span>
    </button>
  </div>
</nav>

<!-- ================= HOME ================= -->
<div id="homePage" class="p-6">
  <h1 class="text-4xl font-bold text-center">Welcome to ShopEasy 🛍️</h1>
  <p class="text-center mt-3">Best online shopping website</p>

  <div class="text-center mt-6">
    <button onclick="showPage('products')"
      class="bg-blue-500 text-white px-6 py-3 rounded">
      Shop Now
    </button>
  </div>
</div>

<!-- ================= PRODUCTS ================= -->
<div id="productsPage" class="p-6 hidden">

  <h1 class="text-3xl font-bold text-center mb-6">Products</h1>

  <!-- Search -->
  <input type="text" placeholder="Search..."
    onkeyup="searchProduct(this.value)"
    class="border p-2 mb-6 w-full md:w-1/2 mx-auto block">

  <!-- Category -->
  <div class="text-center mb-6">
    <button onclick="filterCategory('all')" class="bg-gray-200 px-3 py-1 m-1">All</button>
    <button onclick="filterCategory('fashion')" class="bg-gray-200 px-3 py-1 m-1">Fashion</button>
    <button onclick="filterCategory('electronics')" class="bg-gray-200 px-3 py-1 m-1">Electronics</button>
  </div>

  <!-- Product List -->
  <div id="productList" class="grid md:grid-cols-3 gap-6">

    <div data-name="tshirt" data-category="fashion" class="bg-white p-4 shadow">
      <h2>T-Shirt</h2>
      <p>₹499</p>
      <button onclick="addToCart('T-Shirt',499)" class="bg-blue-500 text-white px-3 py-1 mt-2">Add</button>
    </div>

    <div data-name="watch" data-category="electronics" class="bg-white p-4 shadow">
      <h2>Watch</h2>
      <p>₹999</p>
      <button onclick="addToCart('Watch',999)" class="bg-blue-500 text-white px-3 py-1 mt-2">Add</button>
    </div>

    <div data-name="shoes" data-category="fashion" class="bg-white p-4 shadow">
      <h2>Shoes</h2>
      <p>₹1499</p>
      <button onclick="addToCart('Shoes',1499)" class="bg-blue-500 text-white px-3 py-1 mt-2">Add</button>
    </div>

  </div>
</div>

<!-- ================= CART ================= -->
<div id="cartPage" class="p-6 hidden">

  <h1 class="text-3xl font-bold text-center mb-6">Your Cart 🛒</h1>

  <div id="cartItems"></div>

  <h2 class="text-xl font-bold mt-4">Total: ₹<span id="total">0</span></h2>
</div>

<!-- ================= SCRIPT ================= -->
<script>
let cart = [];

// Page Switch
function showPage(page){
  document.getElementById("homePage").classList.add("hidden");
  document.getElementById("productsPage").classList.add("hidden");
  document.getElementById("cartPage").classList.add("hidden");

  document.getElementById(page + "Page").classList.remove("hidden");

  if(page === "cart"){
    displayCart();
  }
}

// Add to Cart
function addToCart(name, price){
  let item = cart.find(p => p.name === name);

  if(item){
    item.qty++;
  } else {
    cart.push({name, price, qty:1});
  }

  updateCount();
}

// Cart Count
function updateCount(){
  let count = cart.reduce((sum, item) => sum + item.qty, 0);
  document.getElementById("count").innerText = count;
}

// Display Cart
function displayCart(){
  let container = document.getElementById("cartItems");
  let total = 0;

  container.innerHTML = "";

  cart.forEach(item=>{
    total += item.price * item.qty;

    container.innerHTML += `
      <div class="bg-white p-4 mb-3 shadow flex justify-between">
        <div>
          <h2>${item.name}</h2>
          <p>₹${item.price} x ${item.qty}</p>
        </div>
      </div>
    `;
  });

  document.getElementById("total").innerText = total;
}

// Search
function searchProduct(value){
  let items = document.querySelectorAll("#productList > div");
  value = value.toLowerCase();

  items.forEach(item=>{
    let name = item.dataset.name;
    item.style.display = name.includes(value) ? "block" : "none";
  });
}

// Filter
function filterCategory(cat){
  let items = document.querySelectorAll("#productList > div");

  items.forEach(item=>{
    let category = item.dataset.category;
    item.style.display = (cat === "all" || category === cat) ? "block" : "none";
  });
}
</script>

</body>
</html>
